{% extends "default.html" %}

{% block title %}Data Upload{% endblock %}

{% block content %}

<h2>Data Upload</h2>
{% for d in data.sets %}
<section class="boxed">
  {% set photos = d.photos() %}
  <h2>{{d.dir}} ({{photos|length}} photos)</h2>
  <p>Not uploaded.
  </p>
  <div>
    <button hx-get="{{url_for('data_gallery', dir=d.dir)}}" hx-target="closest div">Show images {{indicator()}} </button>
  </div>
</section>
{% endfor %}
{% endblock %}

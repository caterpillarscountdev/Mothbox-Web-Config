{% if error %}<span class="error">{{error}}</span>{% endif %}

<label for="upload_progress"><span id="remainingFiles">{{dataset.upload_total_left}}</span>/<span id="neededFiles">{{dataset.upload_total}}</span></label>
{{indicator()}}
